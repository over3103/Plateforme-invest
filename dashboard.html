<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tableau de bord | Votre Plateforme</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #07110d;
      color: white;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;

      width: 245px;

      padding: 25px 18px;

      background: #050c08;

      border-right: 1px solid rgba(255,255,255,0.07);

      z-index: 100;
    }

    .logo {
      display: block;

      padding: 5px 12px 35px;

      font-size: 20px;
      font-weight: 800;
    }

    .logo span {
      color: #55e58a;
    }

    .menu-title {
      padding: 0 12px;

      margin-bottom: 12px;

      color: #65746b;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 1.5px;

      font-weight: 800;
    }

    .menu {
      display: grid;
      gap: 5px;
    }

    .menu a {
      display: flex;

      align-items: center;

      gap: 12px;

      padding: 13px 12px;

      border-radius: 9px;

      color: #899990;

      font-size: 13px;

      transition: 0.25s;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(85,229,138,0.10);

      color: #55e58a;
    }

    .menu-icon {
      width: 22px;

      text-align: center;

      font-size: 16px;
    }

    .logout {
      position: absolute;

      bottom: 25px;

      left: 18px;
      right: 18px;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 13px 12px;

      border-radius: 9px;

      color: #899990;

      font-size: 13px;
    }

    .logout:hover {
      color: #ff7d7d;

      background: rgba(255,80,80,0.07);
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      margin-left: 245px;

      min-height: 100vh;

      padding: 30px 4%;
    }

    /* =========================
       TOPBAR
    ========================= */

    .topbar {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 35px;
    }

    .welcome h1 {
      font-size: 27px;

      letter-spacing: -1px;
    }

    .welcome p {
      margin-top: 5px;

      color: #74837b;

      font-size: 13px;
    }

    .user-area {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .notification {
      width: 40px;
      height: 40px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 10px;

      border: 1px solid rgba(255,255,255,0.08);

      background: rgba(255,255,255,0.03);

      color: #9aa9a0;

      cursor: pointer;
    }

    .avatar {
      width: 40px;
      height: 40px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #55e58a;

      color: #041008;

      font-size: 13px;

      font-weight: 800;
    }

    /* =========================
       BALANCE
    ========================= */

    .balance-grid {
      display: grid;

      grid-template-columns: 1.6fr 1fr 1fr;

      gap: 17px;

      margin-bottom: 25px;
    }

    .card {
      padding: 25px;

      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.065),
          rgba(255,255,255,0.025)
        );

      border: 1px solid rgba(255,255,255,0.08);
    }

    .balance-card {
      position: relative;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(85,229,138,0.20),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #10251a,
          #0a1710
        );
    }

    .balance-card::after {
      content: "";

      position: absolute;

      width: 170px;
      height: 170px;

      right: -70px;
      bottom: -100px;

      border-radius: 50%;

      background: rgba(85,229,138,0.07);
    }

    .card-label {
      color: #899990;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 1px;

      font-weight: 700;
    }

    .balance {
      margin-top: 10px;

      font-size: 37px;

      font-weight: 800;

      letter-spacing: -1px;
    }

    .balance small {
      font-size: 16px;

      color: #a0afa7;

      font-weight: 600;
    }

    .balance-change {
      margin-top: 12px;

      color: #55e58a;

      font-size: 12px;
    }

      font-size:

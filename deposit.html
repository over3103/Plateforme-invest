<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dépôt - Invest Africa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">INVEST <span>AFRICA</span></div>
    <nav>
        <a href="dashboard.html">Mon espace</a>
    </nav>
</header>

<div class="form-box">

    <h2>💰 Faire un dépôt</h2>

    <p>Choisissez le montant que vous souhaitez déposer.</p>

    <form onsubmit="makeDeposit(); return false;">

        <label>Montant (FCFA)</label>

        <input
            type="number"
            id="depositAmount"
            placeholder="Ex : 10000"
            min="1000"
            required
        >

        <label>Moyen de paiement</label>

        <select id="depositMethod" required>
            <option value="">Choisir</option>
            <option value="Orange Money">Orange Money</option>
            <option value="MTN Money">MTN Money</option>
            <option value="Moov Money">Moov Money</option>
            <option value="Wave">Wave</option>
        </select>

        <button class="btn" type="submit">
            Envoyer la demande
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>

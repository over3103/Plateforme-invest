<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration | Votre Plateforme</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #07110d;
      color: white;
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;

      width: 245px;

      padding: 25px 18px;

      background: #050c08;

      border-right: 1px solid rgba(255,255,255,0.07);

      z-index: 100;
    }

    .logo {
      display: block;

      padding: 5px 12px 35px;

      color: white;

      text-decoration: none;

      font-size: 20px;
      font-weight: 800;
    }

    .logo span {
      color: #55e58a;
    }

    .admin-badge {
      margin: -20px 12px 30px;

      padding: 6px 9px;

      width: fit-content;

      border-radius: 5px;

      background: rgba(85,229,138,0.10);

      color: #55e58a;

      font-size: 9px;

      font-weight: 800;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .menu-title {
      padding: 0 12px;

      margin-bottom: 12px;

      color: #65746b;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .menu {
      display: grid;

      gap: 5px;
    }

    .menu button,
    .menu a {
      width: 100%;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 13px 12px;

      border: none;

      border-radius: 9px;

      background: transparent;

      color: #899990;

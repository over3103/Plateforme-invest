<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Invest Africa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header admin-header">

    <div class="logo">
        ADMIN <span>INVEST AFRICA</span>
    </div>

    <nav>
        <a href="index.html">Site</a>
        <a href="#" onclick="logoutAdmin()">Déconnexion</a>
    </nav>

</header>

<div class="container">

    <h1 class="page-title">Espace administrateur</h1>

    <div class="dashboard-grid">

        <div class="stat">
            <h3>Utilisateurs</h3>
            <strong id="usersCount">0</strong>
        </div>

        <div class="stat">
            <h3>Dépôts</h3>
            <strong id="depositsCount">0</strong>
        </div>

        <div class="stat">
            <h3>Retraits</h3>
            <strong id="withdrawalsCount">0</strong>
        </div>

        <div class="stat">
            <h3>Transactions</h3>
            <strong id="transactionsCount">0</strong>
        </div>

    </div>

    <h2 style="margin:30px 0 15px;">
        Dernières opérations
    </h2>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>Type</th>
                    <th>Montant</th>
                    <th>Moyen</th>
                    <th>Date</th>
                    <th>Statut</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="adminHistory">

            </tbody>

        </table>

    </div>

</div>

<script>

if (localStorage.getItem("investAfricaAdmin") !== "true") {
    window.location.href = "login.html";
}

function formatMoney(amount) {
    return Number(amount || 0).toLocaleString("fr-FR") + " FCFA";
}

function loadAdmin() {

    const history =
        JSON.parse(localStorage.getItem("investAfricaHistory")) || [];

    const tbody = document.getElementById("adminHistory");

    const deposits =
        history.filter(x => x.type === "Dépôt");

    const withdrawals =
        history.filter(x => x.type === "Retrait");

    document.getElementById("usersCount").textContent =
        localStorage.getItem("investAfricaUser") ? "1" : "0";

    document.getElementById("depositsCount").textContent =
        deposits.length;

    document.getElementById("withdrawalsCount").textContent =
        withdrawals.length;

    document.getElementById("transactionsCount").textContent =
        history.length;

    tbody.innerHTML = "";

    if (history.length === 0) {
        tbody.innerHTML =
            '<tr><td colspan="6">Aucune transaction.</td></tr>';
        return;
    }

    history.forEach((item, index) => {

        tbody.innerHTML += `
            <tr>
                <td>${item.type}</td>
                <td>${formatMoney(item.amount)}</td>
                <td>${item.method}</td>
                <td>${item.date}</td>
                <td class="pending">${item.status}</td>
                <td>
                    <button class="btn"
                        onclick="validateTransaction(${index})">
                        Valider
                    </button>
                </td>
            </tr>
        `;
    });
}

function validateTransaction(index) {

    let history =
        JSON.parse(localStorage.getItem("investAfricaHistory")) || [];

    if (history[index]) {
        history[index].status = "Validé";
        localStorage.setItem(
            "investAfricaHistory",
            JSON.stringify(history)
        );
    }

    loadAdmin();
}

function logoutAdmin() {
    localStorage.removeItem("investAfricaAdmin");
    window.location.href = "login.html";
}

loadAdmin();

</script>

</body>
</html>

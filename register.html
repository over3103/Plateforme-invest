<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Créer un compte - Housing Investment</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page">


<div class="auth-box">

    <!-- RETOUR -->

    <a
        href="index.html"
        class="back"
    >
        ← Retour à l'accueil
    </a>


    <!-- TITRE -->

    <h1>
        Créer un compte
    </h1>

    <p class="muted">
        Rejoignez Housing Investment
        et accédez à votre espace personnel.
    </p>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message hidden"
    ></div>


    <!-- FORMULAIRE -->

    <form
        id="registerForm"
        novalidate
    >


        <!-- NOM -->

        <label for="name">
            Nom complet
        </label>

        <input
            id="name"
            name="name"
            type="text"
            placeholder="Exemple : Jean Kouassi"
            autocomplete="name"
            required
        >


        <!-- TELEPHONE -->

        <label for="phone">
            Téléphone ou identifiant
        </label>

        <input
            id="phone"
            name="phone"
            type="text"
            placeholder="Exemple : 0700000000"
            autocomplete="username"
            required
        >


        <!-- MOT DE PASSE -->

        <label for="password">
            Mot de passe
        </label>

        <input
            id="password"
            name="password"
            type="password"
            placeholder="Minimum 6 caractères"
            autocomplete="new-password"
            required
        >


        <!-- CONFIRMATION -->

        <label for="confirmPassword">
            Confirmer le mot de passe
        </label>

        <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Répétez votre mot de passe"
            autocomplete="new-password"
            required
        >


        <!-- CONDITIONS -->

        <label class="terms">

            <input
                id="terms"
                type="checkbox"
                required
            >

            <span>
                J'accepte les conditions
                d'utilisation de la plateforme.
            </span>

        </label>


        <!-- BOUTON -->

        <button
            type="submit"
            class="btn full"
        >
            Créer mon compte
        </button>


    </form>


    <!-- CONNEXION -->

    <p class="switch">

        Vous avez déjà un compte ?

        <a href="login.html">
            Se connecter
        </a>

    </p>


</div>


<!-- SCRIPT -->

<script src="script.js"></script>


<script>

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        function(event) {

            const terms =
                document.getElementById("terms");

            if (!terms.checked) {

                event.preventDefault();

                showMessage(
                    "Veuillez accepter les conditions d'utilisation."
                );

                return;

            }

            registerUser(event);

        }
    );

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Créer un compte | Votre Plateforme</title>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  min-height: 100vh;

  font-family: "Inter", Arial, sans-serif;

  color: white;

  background:
    radial-gradient(
      circle at 80% 20%,
      rgba(85,229,138,0.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 10% 90%,
      rgba(85,229,138,0.06),
      transparent 30%
    ),
    #06100b;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.container {

  width: 100%;

  max-width: 500px;

}

.card {

  padding: 38px;

  border-radius: 22px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.065),
      rgba(255,255,255,0.025)
    );

  border:
    1px solid rgba(255,255,255,0.09);

  box-shadow:
    0 30px 90px rgba(0,0,0,0.40);

}

.logo {

  display: block;

  margin-bottom: 30px;

  color: white;

  text-decoration: none;

  font-size: 21px;

  font-weight: 800;

}

.logo span {
  color: #55e58a;
}

.badge {

  display: inline-block;

  padding: 6px 10px;

  margin-bottom: 15px;

  border-radius: 50px;

  background:
    rgba(85,229,138,0.09);

  border:
    1px solid rgba(85,229,138,0.17);

  color: #55e58a;

  font-size: 9px;

  font-weight: 800;

  text-transform: uppercase;

  letter-spacing: 1px;

}

h1 {

  font-size: 30px;

  letter-spacing: -1px;

}

.description {

  margin-top: 8px;

  color: #77857d;

  font-size: 12px;

  line-height: 1.6;

}

.form-group {

  margin-top: 20px;

}

label {

  display: block;

  margin-bottom: 8px;

  color: #aab5ae;

  font-size: 10px;

  font-weight: 700;

}

input {

  width: 100%;

  height: 49px;

  padding: 0 14px;

  border: 1px solid rgba(255,255,255,0.10);

  border-radius: 9px;

  outline: none;

  background:
    rgba(255,255,255,0.035);

  color: white;

  font-size: 12px;

}

input:focus {

  border-color:
    rgba(85,229,138,0.50);

  box-shadow:
    0 0 0 3px rgba(85,229,138,0.05);

}

input::placeholder {
  color: #56635b;
}

.phone {

  display: flex;

  gap: 8px;

}

.prefix {

  width: 75px;

  height: 49px;

  display: flex;

  align-items: center;

  justify-content: center;

  border:
    1px solid rgba(255,255,255,0.10);

  border-radius: 9px;

  background:
    rgba(85,229,138,0.05);

  color: #55e58a;

  font-size: 12px;

  font-weight: 800;

}

.phone input {
  flex: 1;
}

.password-box {
  position: relative;
}

.password-box input {
  padding-right: 50px;
}

.show-password {

  position: absolute;

  right: 8px;

  top: 7px;

  width: 35px;

  height: 35px;

  border: none;

  border-radius: 7px;

  background: transparent;

  color: #718078;

  cursor: pointer;

}

.show-password:hover {
  color: #55e58a;
}

.optional {

  color: #66736c;

  font-size: 9px;

  font-weight: 400;

}

.submit {

  width: 100%;

  height: 49px;

  margin-top: 27px;

  border: none;

  border-radius: 9px;

  background: #55e58a;

  color: #041008;

  font-size: 12px;

  font-weight: 800;

  cursor: pointer;

  transition: 0.25s;

}

.submit:hover {

  background: #72ee9d;

  transform: translateY(-2px);

  box-shadow:
    0 12px 30px rgba(85,229,138,0.18);

}

.login {

  margin-top: 23px;

  text-align: center;

  color: #718078;

  font-size: 11px;

}

.login a {

  color: #55e58a;

  font-weight: 700;

  text-decoration: none;

}

.note {

  margin-top: 22px;

  padding: 12px;

  border-radius: 9px;

  background:
    rgba(255,255,255,0.025);

  color: #65736b;

  font-size: 9px;

  line-height: 1.6;

}

@media(max-width:500px) {

  body {
    padding: 12px;
  }

  .card {
    padding: 27px 21px;
  }

  h1 {
    font-size: 26px;
  }

}

</style>

</head>


<body>


<div class="container">


  <div class="card">


    <a
      href="index.html"
      class="logo"
    >
      VOTRE<span>PLATEFORME</span>
    </a>


    <div class="badge">
      Inscription
    </div>


    <h1>
      Créer votre compte
    </h1>


    <p class="description">
      Remplissez les informations ci-dessous
      pour créer votre espace personnel.
    </p>


    <form
      onsubmit="return registerAccount(event)"
    >


      <!-- NOM COMPLET -->

      <div class="form-group">

        <label for="fullName">
          Nom complet
        </label>

        <input
          type="text"
          id="fullName"
          placeholder="Ex : Jean Kouassi"
          autocomplete="name"
          required
        >

      </div>


      <!-- TELEPHONE -->

      <div class="form-group">

        <label for="phone">
          Numéro de téléphone
        </label>


        <div class="phone">

          <div class="prefix">
            +225
          </div>

          <input
            type="tel"
            id="phone"
            placeholder="07 00 00 00 00"
            maxlength="10"
            autocomplete="tel"
            required
          >

        </div>

      </div>


      <!-- MOT DE PASSE -->

      <div class="form-group">

        <label for="password">
          Mot de passe
        </label>


        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Minimum 6 caractères"
            minlength="6"
            autocomplete="new-password"
            required
          >


          <button
            type="button"
            class="show-password"
            onclick="togglePassword('password')"
          >
            ◉
          </button>

        </div>

      </div>


      <!-- CONFIRMATION -->

      <div class="form-group">

        <label for="confirmPassword">
          Confirmer le mot de passe
        </label>


        <div class="password-box">

          <input
            type="password"
            id="confirmPassword"
            placeholder="Répétez votre mot de passe"
            minlength="6"
            autocomplete="new-password"
            required
          >


          <button
            type="button"
            class="show-password"
            onclick="togglePassword('confirmPassword')"
          >
            ◉
          </button>

        </div>

      </div>


      <!-- CODE INVITATION -->

      <div class="form-group">

        <label for="invitation">

          Code d'invitation

          <span class="optional">
            (facultatif)
          </span>

        </label>

        <input
          type="text"
          id="invitation"
          placeholder="Entrez votre code si vous en avez un"
        >

      </div>


      <button
        type="submit"
        class="submit"
      >
        Créer mon compte
      </button>


    </form>


    <div class="login">

      Vous avez déjà un compte ?

      <a href="login.html">
        Se connecter
      </a>

    </div>


    <div class="note">

      🔒 Vos informations sont utilisées pour
      créer et gérer votre espace personnel.

    </div>


  </div>


</div>


<script>

function togglePassword(id) {

  const input =
    document.getElementById(id);

  if (
    input.type === "password"
  ) {

    input.type = "text";

  } else {

    input.type = "password";

  }

}


function registerAccount(event) {

  event.preventDefault();


  const name =
    document.getElementById(
      "fullName"
    ).value.trim();


  let phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const password =
    document.getElementById(
      "password"
    ).value;


  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    ).value;


  const invitation =
    document.getElementById(
      "invitation"
    ).value.trim();


  /* Nettoyage du téléphone */

  phone =
    phone.replace(
      /\D/g,
      ""
    );


  /* Vérification téléphone */

  if (
    phone.length !== 10
  ) {

    alert(
      "Veuillez entrer un numéro ivoirien valide de 10 chiffres."
    );

    return false;

  }


  /* Vérification mot de passe */

  if (
    password.length < 6
  ) {

    alert(
      "Le mot de passe doit contenir au moins 6 caractères."
    );

    return false;

  }


  if (
    password !== confirmPassword
  ) {

    alert(
      "Les deux mots de passe ne correspondent pas."
    );

    return false;

  }


  /* Récupération utilisateurs */

  let users = [];

  try {

    users =
      JSON.parse(
        localStorage.getItem(
          "users"
        )
      ) || [];

  } catch(error) {

    users = [];

  }


  const fullPhone =
    "+225" + phone;


  /* Vérification doublon */

  const existing =
    users.find(
      user =>
        user.phone === fullPhone
    );


  if (existing) {

    alert(
      "Ce numéro possède déjà un compte."
    );

    return false;

  }


  /* Création du compte */

  const newUser = {

    id:
      "USER-" +
      Date.now(),

    name:
      name,

    phone:
      fullPhone,

    password:
      password,

    invitationCode:
      invitation,

    balance:
      0,

    invested:
      0,

    earnings:
      0,

    createdAt:
      new Date().toLocaleString(
        "fr-FR"
      )

  };


  users.push(
    newUser
  );


  localStorage.setItem(
    "users",
    JSON.stringify(users)
  );


  localStorage.setItem(
    "currentUser",
    JSON.stringify(newUser)
  );


  alert(
    "Votre compte a été créé avec succès."
  );


  window.location.href =
    "dashboard.html";


  return false;

}

</script>


</body>

</html>

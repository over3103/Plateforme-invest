<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion - Housing Investment</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page">


<div class="auth-box">

    <!-- RETOUR -->

    <a
        href="index.html"
        class="back"
    >
        ← Retour à l'accueil
    </a>


    <!-- TITRE -->

    <h1>
        Se connecter
    </h1>

    <p class="muted">
        Accédez à votre espace Housing Investment.
    </p>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message hidden"
    ></div>


    <!-- FORMULAIRE -->

    <form
        id="loginForm"
        novalidate
    >


        <!-- IDENTIFIANT -->

        <label for="phone">
            Téléphone ou identifiant
        </label>

        <input
            id="phone"
            name="phone"
            type="text"
            placeholder="Exemple : 0700000000"
            autocomplete="username"
            required
        >


        <!-- MOT DE PASSE -->

        <label for="password">
            Mot de passe
        </label>

        <input
            id="password"
            name="password"
            type="password"
            placeholder="Votre mot de passe"
            autocomplete="current-password"
            required
        >


        <!-- BOUTON -->

        <button
            type="submit"
            class="btn full"
        >
            Se connecter
        </button>


    </form>


    <!-- CREATION COMPTE -->

    <p class="switch">

        Vous n'avez pas encore de compte ?

        <a href="register.html">
            Créer un compte
        </a>

    </p>


    <!-- ADMIN -->

    <p class="demo-note">

        Accès administrateur de démonstration :
        <strong>admin</strong> /
        <strong>admin123</strong>

    </p>


</div>


<!-- SCRIPT -->

<script src="script.js"></script>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        loginUser
    );

</script>


</body>

</html>

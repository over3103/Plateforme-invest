      box-sizing: border-box;

    body {

      min-height: 100vh;
      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(85,229,138,0.16),
          transparent 30%
        ),
        linear-gradient(135deg, #041008, #0b1d13);

      color: white;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       NAVIGATION
    ========================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

      padding: 20px 6%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: rgba(4,16,8,0.72);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(255,255,255,0.08);

      z-index: 10;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #55e58a;
    }

    .back {
      color: #a8b8ae;
      font-size: 14px;
    }

    .back:hover {
      color: #55e58a;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 120px 20px 50px;
    }

    .auth-container {
      width: 100%;
      max-width: 1050px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      background: rgba(255,255,255,0.045);

      border: 1px solid rgba(255,255,255,0.09);

      border-radius: 25px;

      overflow: hidden;

      box-shadow:
        0 30px 100px rgba(0,0,0,0.35);

      backdrop-filter: blur(20px);
    }

    /* =========================
       PRESENTATION
    ========================= */

    .presentation {
      padding: 60px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      background:
        radial-gradient(
          circle at 70% 30%,
          rgba(85,229,138,0.20),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          rgba(85,229,138,0.08),
          rgba(255,255,255,0.015)
        );
    }

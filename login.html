<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Connexion | Housing Investment
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =================================================
     HEADER
================================================= -->

<header class="topbar">

    <div class="logo">
        HOUSING <span>INVESTMENT</span>
    </div>

    <nav>

        <a href="index.html">
            Accueil
        </a>

        <a href="register.html"
           class="btn btn-small">
            Créer un compte
        </a>

    </nav>

</header>



<!-- =================================================
     CONNEXION
================================================= -->

<main class="auth-container">

    <section class="auth-card">

        <div class="auth-header">

            <span class="section-tag">
                ESPACE MEMBRE
            </span>

            <h1>
                Se connecter
            </h1>

            <p>
                Connectez-vous à votre espace
                Housing Investment.
            </p>

        </div>



        <!-- MESSAGE -->

        <div
            id="loginMessage"
            class="auth-message"
            style="display:none;"
        ></div>



        <!-- FORMULAIRE -->

        <form
            id="loginForm"
            autocomplete="on"
        >


            <div class="form-group">

                <label for="loginEmail">
                    Adresse e-mail
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="Votre adresse e-mail"
                    autocomplete="email"
                    required
                >

            </div>



            <div class="form-group">

                <label for="loginPassword">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Votre mot de passe"
                    autocomplete="current-password"
                    required
                >

            </div>



            <button
                type="submit"
                class="btn auth-submit"
            >
                Se connecter
            </button>


        </form>



        <!-- LIEN INSCRIPTION -->

        <div class="auth-footer">

            <p>
                Vous n'avez pas encore de compte ?
            </p>

            <a href="register.html">
                Créer un compte
            </a>

        </div>


    </section>

</main>



<!-- =================================================
     FOOTER
================================================= -->

<footer>

    <div class="footer-logo">
        HOUSING INVESTMENT
    </div>

    <p>
        © 2026 Housing Investment.
        Tous droits réservés.
    </p>

</footer>



<!-- =================================================
     JAVASCRIPT CONNEXION
================================================= -->

<script>

const loginForm =
    document.getElementById("loginForm");

const loginMessage =
    document.getElementById("loginMessage");



function showMessage(message, type) {

    loginMessage.textContent =
        message;

    loginMessage.style.display =
        "block";

    loginMessage.className =
        "auth-message " + type;

}



loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("loginPassword")
                .value;


        if (!email || !password) {

            showMessage(
                "Veuillez remplir tous les champs.",
                "error"
            );

            return;

        }



        /*
         * Récupération du compte enregistré.
         */

        let registeredUser = null;


        try {

            registeredUser =
                JSON.parse(
                    localStorage.getItem(
                        "registeredUser"
                    )
                );

        } catch (error) {

            registeredUser = null;

        }



        /*
         * Si aucun compte n'existe.
         */

        if (!registeredUser) {

            showMessage(
                "Aucun compte trouvé. Veuillez d'abord créer un compte.",
                "error"
            );

            return;

        }



        /*
         * Vérification de l'e-mail.
         */

        const savedEmail =
            String(
                registeredUser.email || ""
            )
            .trim()
            .toLowerCase();


        /*
         * Vérification du mot de passe.
         */

        const savedPassword =
            String(
                registeredUser.password || ""
            );



        if (
            email !== savedEmail ||
            password !== savedPassword
        ) {

            showMessage(
                "Adresse e-mail ou mot de passe incorrect.",
                "error"
            );

            return;

        }



        /*
         * Connexion réussie.
         */

        localStorage.setItem(
            "currentUser",
            JSON.stringify(
                registeredUser
            )
        );


        /*
         * Création du solde s'il n'existe pas.
         */

        if (
            localStorage.getItem(
                "userBalance"
            ) === null
        ) {

            localStorage.setItem(
                "userBalance",
                "0"
            );

        }



        showMessage(
            "Connexion réussie. Redirection...",
            "success"
        );



        setTimeout(
            function() {

                window.location.href =
                    "dashboard.html";

            },
            800
        );

    }
);

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Connexion - Invest Plus</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <section class="dashboard-section">

        <h1>Connexion</h1>

        <p>
            Connectez-vous à votre espace utilisateur.
        </p>

        <br>

        <label>Nom</label>

        <input
            type="text"
            id="loginName"
            placeholder="Votre nom"
        >

        <label>Téléphone</label>

        <input
            type="text"
            id="loginPhone"
            placeholder="Votre numéro"
        >

        <button onclick="login()">
            Se connecter
        </button>

        <p id="loginMessage"></p>

        <br>

        <p>
            Vous n'avez pas encore de compte ?
        </p>

        <button onclick="createAccount()">
            Créer un compte
        </button>

    </section>

</div>

<script>

function login() {

    const name =
        document.getElementById("loginName").value.trim();

    const phone =
        document.getElementById("loginPhone").value.trim();

    if (!name || !phone) {

        document.getElementById("loginMessage").textContent =
            "Veuillez remplir tous les champs.";

        return;
    }

    let user =
        JSON.parse(localStorage.getItem("investUser"));

    if (!user) {

        user = {

            name: name,

            phone: phone,

            email: "",

            balance: 0,

            earnings: 0,

            investments: [],

            history: []

        };

    } else {

        user.name = name;
        user.phone = phone;

    }

    localStorage.setItem(
        "investUser",
        JSON.stringify(user)
    );

    window.location.href = "dashboard.html";

}


function createAccount() {

    window.location.href = "index.html";

}

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="fr">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Connexion | Votre Plateforme</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      font-family: "Inter", Arial, sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(85,229,138,0.12),
          transparent 30%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(85,229,138,0.06),
          transparent 30%
        ),
        #06100b;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px;

    }


    .page {

      width: 100%;

      max-width: 1050px;

      min-height: 620px;

      display: grid;

      grid-template-columns: 1.05fr 0.95fr;

      overflow: hidden;

      border-radius: 24px;

      border: 1px solid rgba(255,255,255,0.09);

      background:
        rgba(8,20,13,0.96);

      box-shadow:
        0 35px 100px rgba(0,0,0,0.45);

    }


    /* =========================
       PARTIE GAUCHE
    ========================= */

    .presentation {

      position: relative;

      padding: 55px;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #0d2617,
          #07140d
        );

    }


    .presentation::before {

      content: "";

      position: absolute;

      width: 350px;

      height: 350px;

      right: -120px;

      top: -100px;

      border-radius: 50%;

      background:
        rgba(85,229,138,0.10);

      filter: blur(10px);

    }


    .presentation::after {

      content: "";

      position: absolute;

      width: 250px;

      height: 250px;

      left: -120px;

      bottom: -100px;

      border-radius: 50%;

      background:
        rgba(85,229,138,0.06);

    }

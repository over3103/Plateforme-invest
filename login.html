<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Invest Africa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">INVEST <span>AFRICA</span></div>
    <nav>
        <a href="index.html">Accueil</a>
    </nav>
</header>

<div class="form-box">

    <h2 id="formTitle">Connexion</h2>

    <form id="authForm">

        <div id="nameField" style="display:none;">
            <label>Nom complet</label>
            <input type="text" id="name" placeholder="Votre nom">
        </div>

        <label>Numéro de téléphone</label>
        <input type="tel" id="phone" placeholder="Ex : 0700000000" required>

        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="Mot de passe" required>

        <button class="btn" type="submit" id="submitBtn">
            Se connecter
        </button>

    </form>

    <p style="margin-top:20px;">
        <a href="#" id="toggleMode">Créer un compte</a>
    </p>

</div>

<script>
let registerMode = new URLSearchParams(window.location.search).get("register") === "true";

const formTitle = document.getElementById("formTitle");
const nameField = document.getElementById("nameField");
const toggleMode = document.getElementById("toggleMode");
const submitBtn = document.getElementById("submitBtn");

function updateForm() {
    if (registerMode) {
        formTitle.textContent = "Créer un compte";
        nameField.style.display = "block";
        toggleMode.textContent = "J'ai déjà un compte";
        submitBtn.textContent = "Créer mon compte";
    } else {
        formTitle.textContent = "Connexion";
        nameField.style.display = "none";
        toggleMode.textContent = "Créer un compte";
        submitBtn.textContent = "Se connecter";
    }
}

toggleMode.addEventListener("click", function(e) {
    e.preventDefault();
    registerMode = !registerMode;
    updateForm();
});

document.getElementById("authForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const phone = document.getElementById("phone").value;
    const password = document.getElementById("password").value;
    const name = document.getElementById("name").value;

    if (registerMode) {

        if (!name) {
            alert("Veuillez entrer votre nom.");
            return;
        }

        const newUser = {
            name: name,
            phone: phone,
            password: password,
            balance: 0,
            investment: 0,
            dailyGain: 0
        };

        localStorage.setItem(
            "investAfricaUser",
            JSON.stringify(newUser)
        );

        localStorage.setItem("investAfricaLoggedIn", "true");

        alert("Compte créé avec succès.");
        window.location.href = "dashboard.html";

    } else {

        // Compte administrateur de démonstration
        if (phone === "admin" && password === "admin123") {
            localStorage.setItem("investAfricaAdmin", "true");
            window.location.href = "admin.html";
            return;
        }

        const savedUser =
            JSON.parse(localStorage.getItem("investAfricaUser"));

        if (!savedUser ||
            savedUser.phone !== phone ||
            savedUser.password !== password) {

            alert("Numéro ou mot de passe incorrect.");
            return;
        }

        localStorage.setItem("investAfricaLoggedIn", "true");
        window.location.href = "dashboard.html";
    }
});

updateForm();
</script>

</body>
</html>

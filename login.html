<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - InvestPlus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        Invest<span>Plus</span>
    </div>

    <nav>
        <a href="index.html">Accueil</a>
    </nav>

</header>

<div class="form-container">

    <h2>Connexion</h2>

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Adresse e-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Votre adresse e-mail"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Mot de passe
            </label>

            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
                required
            >

        </div>

        <button
            type="submit"
            class="form-button"
        >
            Se connecter
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
